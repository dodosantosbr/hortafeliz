<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#2b3a1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roça Feliz" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="pwa/apple-touch-icon.png" />
    <link rel="icon" href="pwa/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Roça Feliz</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@500;700&display=swap"
    />
    <style>
      [hidden] {
        display: none !important;
      }
      html {
        color-scheme: light;
      }
      body {
        margin: 0;
      }
      :root {
        --panel: #fff8e4;
        --ink: #2c3a20;
        --ink-soft: #5b6b49;
        --line: #d7caa4;
        --leaf: #4c9a38;
        --coin: #e3a900;
        --accent: #d9582b;
        --hud: rgba(48, 32, 18, 0.88);
        --hud-ink: #fff3d6;
        --hud-line: #8a6238;
        --soil: #9a6238;
        --soil-dark: #6f4527;
        --mound: #7d4c2a;
        --lockg: #2f5d2c;
        --lockg-hi: #3f7a38;
        --font-display: "Bagel Fat One", "Trebuchet MS", sans-serif;
        --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --panel: #2a3320;
          --ink: #eef3de;
          --ink-soft: #b2c096;
          --line: #455336;
          --leaf: #6cc152;
          --coin: #f2c230;
          --accent: #ff7a4a;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --panel: #2a3320;
        --ink: #eef3de;
        --ink-soft: #b2c096;
        --line: #455336;
        --leaf: #6cc152;
        --coin: #f2c230;
        --accent: #ff7a4a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: #6ec1ee;
        color: var(--ink);
        font-family: var(--font-body);
        font-size: 15px;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .app {
        position: relative;
        height: 100%;
        min-height: 560px;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        --sky1: #5bc0f0;
        --sky2: #cdeeff;
        --m1: #a6e24a;
        --m2: #6cc02a;
        --tree: #4fae2e;
        --water: #4aa8d8;
        --sand: #e6d49a;
        --wheat: #e5cb4f;
        --shade: 0;
        --star: 0;
        --cloud: 0.95;
      }
      .app[data-phase="dawn"] {
        --sky1: #7aa7d9;
        --sky2: #ffd2a8;
        --m1: #a0d64e;
        --m2: #6aae35;
        --tree: #47a02e;
        --shade: 0.07;
        --cloud: 0.8;
      }
      .app[data-phase="dusk"] {
        --sky1: #5a4a8a;
        --sky2: #ffb27a;
        --m1: #8fc440;
        --m2: #5a9a2c;
        --tree: #3a8a2c;
        --shade: 0.16;
        --cloud: 0.7;
      }
      .app[data-phase="night"] {
        --sky1: #0b1633;
        --sky2: #2a3b6e;
        --m1: #3f7d3a;
        --m2: #245a2a;
        --tree: #245a2a;
        --shade: 0.3;
        --star: 1;
        --cloud: 0.3;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .scene:not(.shade) {
        background: linear-gradient(var(--sky1), var(--sky2) 15%);
      }
      .scene > * {
        position: absolute;
      }
      .stars {
        left: 0;
        right: 0;
        top: 0;
        height: 14%;
        opacity: var(--star);
        transition: opacity 1s;
        background-image:
          radial-gradient(1.5px 1.5px at 8% 18%, #fff, transparent),
          radial-gradient(1.5px 1.5px at 22% 8%, #fff, transparent),
          radial-gradient(2px 2px at 35% 26%, #fff, transparent),
          radial-gradient(1.5px 1.5px at 48% 12%, #fff, transparent),
          radial-gradient(2px 2px at 61% 22%, #fff, transparent),
          radial-gradient(1.5px 1.5px at 74% 6%, #fff, transparent),
          radial-gradient(1.5px 1.5px at 86% 20%, #fff, transparent),
          radial-gradient(2px 2px at 94% 10%, #fff, transparent);
      }
      .orb {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .sun {
        background: radial-gradient(
          circle,
          #fffbd0 30%,
          #ffd23f 60%,
          rgba(255, 210, 63, 0) 72%
        );
        box-shadow: 0 0 40px 14px rgba(255, 224, 120, 0.45);
      }
      .moon {
        background: #f3f1e2;
        box-shadow:
          inset -9px -3px 0 0 #d8d6c4,
          0 0 26px 6px rgba(220, 230, 255, 0.35);
      }
      .cloud {
        top: 3%;
        left: -170px;
        width: 110px;
        opacity: var(--cloud);
        animation: drift 90s linear infinite;
      }
      .cloud.c2 {
        top: 7%;
        width: 84px;
        animation-duration: 130s;
        animation-delay: -50s;
      }
      .cloud.c3 {
        top: 1%;
        width: 120px;
        animation-duration: 170s;
        animation-delay: -110s;
      }
      @keyframes drift {
        to {
          transform: translateX(calc(100vw + 340px));
        }
      }
      .meadow {
        left: 0;
        right: 0;
        top: 12%;
        bottom: 0;
        background:
          radial-gradient(
            ellipse 30% 14% at 18% 30%,
            rgba(255, 255, 255, 0.14),
            transparent 70%
          ),
          radial-gradient(
            ellipse 26% 12% at 82% 64%,
            rgba(255, 255, 255, 0.12),
            transparent 70%
          ),
          url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27220%27%20height%3D%27150%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%234f9a1a%27%20stroke-width%3D%272.2%27%20stroke-linecap%3D%27round%27%20opacity%3D%27.55%27%3E%3Cpath%20d%3D%27M20%2040l-4-9M20%2040l1-11M20%2040l5-9%27%2F%3E%3Cpath%20d%3D%27M150%2028l-4-9M150%2028l1-11M150%2028l5-9%27%2F%3E%3Cpath%20d%3D%27M90%20110l-4-9M90%20110l1-11M90%20110l5-9%27%2F%3E%3Cpath%20d%3D%27M190%20120l-4-8M190%20120l1-10M190%20120l5-8%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2760%27%20cy%3D%2780%27%20r%3D%273%27%20fill%3D%27%23fff%27%2F%3E%3Ccircle%20cx%3D%2760%27%20cy%3D%2780%27%20r%3D%271.2%27%20fill%3D%27%23ffd93a%27%2F%3E%3Ccircle%20cx%3D%27170%27%20cy%3D%2770%27%20r%3D%273%27%20fill%3D%27%23ffe14d%27%2F%3E%3Ccircle%20cx%3D%27120%27%20cy%3D%2720%27%20r%3D%272.6%27%20fill%3D%27%23fff%27%2F%3E%3Ccircle%20cx%3D%2728%27%20cy%3D%27125%27%20r%3D%272.6%27%20fill%3D%27%23ff9ec4%27%2F%3E%3Ccircle%20cx%3D%27200%27%20cy%3D%2715%27%20r%3D%272.4%27%20fill%3D%27%23fff%27%2F%3E%3C%2Fsvg%3E")
            0 0/220px 150px repeat,
          linear-gradient(var(--m1), var(--m2));
      }
      .treeline {
        left: 0;
        width: 100%;
        top: 8%;
        height: 6%;
      }
      .house {
        left: 2%;
        top: 10.5%;
        width: clamp(120px, 24vw, 220px);
      }
      .tree {
        width: clamp(46px, 9vw, 78px);
      }
      .tree.t1 {
        left: 30%;
        top: 19%;
      }
      .tree.t2 {
        left: 2%;
        top: 41%;
        width: clamp(54px, 10vw, 92px);
      }
      .sunf {
        right: 0;
        top: 12.5%;
        width: clamp(76px, 10vw, 124px);
      }
      .fence {
        height: clamp(24px, 3.6vw, 36px);
        border-radius: 4px;
        filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.18));
        background:
          repeating-linear-gradient(
            90deg,
            #8a5a2c 0 7px,
            #c28444 7px 11px,
            transparent 11px 46px
          ),
          linear-gradient(#e0a86a, #c48a4e) 0 28%/100% 14% no-repeat,
          linear-gradient(#e0a86a, #c48a4e) 0 66%/100% 14% no-repeat;
      }
      .garden {
        left: 1%;
        bottom: 96px;
        width: clamp(110px, 15vw, 170px);
      }
      .butter {
        left: 11%;
        bottom: 170px;
        width: 34px;
        animation: flutter 7s ease-in-out infinite;
      }
      .bw {
        transform-origin: 20px 15px;
        animation: flap 0.35s ease-in-out infinite alternate;
      }
      @keyframes flap {
        to {
          transform: scaleX(0.45);
        }
      }
      @keyframes flutter {
        0%,
        100% {
          transform: translate(0, 0) rotate(-8deg);
        }
        50% {
          transform: translate(70px, -34px) rotate(10deg);
        }
      }
      .sheep {
        left: 88%;
        top: 33%;
        width: clamp(40px, 6vw, 62px);
      }
      .duck {
        left: 83%;
        top: 39%;
        width: clamp(26px, 3.6vw, 38px);
      }
      .nest {
        left: 92%;
        top: 39.5%;
        width: clamp(36px, 5vw, 56px);
      }
      .coop {
        left: 80%;
        top: 21.5%;
        width: clamp(52px, 10vw, 84px);
      }
      .hen {
        left: 64%;
        top: 30%;
        width: 38px;
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        animation: walk 34s ease-in-out infinite;
      }
      @keyframes walk {
        0% {
          transform: translateX(0) scaleX(1);
        }
        45% {
          transform: translateX(8vw) scaleX(1);
        }
        50% {
          transform: translateX(8vw) scaleX(-1);
        }
        95% {
          transform: translateX(0) scaleX(-1);
        }
        100% {
          transform: translateX(0) scaleX(1);
        }
      }
      .hen svg,
      .cow svg,
      .sheep,
      .duck,
      .nest,
      .coop {
        filter: drop-shadow(1.5px 0 0 #3a2f2a) drop-shadow(-1.5px 0 0 #3a2f2a)
          drop-shadow(0 1.5px 0 #3a2f2a) drop-shadow(0 -1.5px 0 #3a2f2a);
      }
      .flock {
        inset: 0;
        pointer-events: none;
      }
      .flock > * {
        position: absolute;
        pointer-events: auto;
      }
      .cow {
        width: clamp(50px, 9vw, 74px);
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        animation: graze 5s ease-in-out infinite;
      }
      .cow svg {
        display: block;
        width: 100%;
      }
      @keyframes graze {
        50% {
          transform: translateY(-2px) rotate(-1.5deg);
        }
      }
      .field {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }
      .pw {
        position: absolute;
        width: var(--tw);
        height: calc(var(--tw) / 2);
      }
      .pw {
        --th: calc(var(--tw) * 0.16);
      }
      .pw.bed::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: calc(var(--tw) / 2 + var(--th));
        clip-path: polygon(
          2% calc(var(--tw) * 0.25),
          50% calc(var(--tw) * 0.49),
          98% calc(var(--tw) * 0.25),
          98% calc(var(--tw) * 0.25 + var(--th)),
          50% calc(var(--tw) * 0.49 + var(--th)),
          2% calc(var(--tw) * 0.25 + var(--th))
        );
        background: linear-gradient(90deg, #6e4322 50%, #452712 50%);
      }
      .pw.bed::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: calc(var(--tw) / 2 + var(--th));
        pointer-events: none;
        clip-path: polygon(
          2% calc(var(--tw) * 0.25),
          50% calc(var(--tw) * 0.49),
          50% calc(var(--tw) * 0.49 + var(--th)),
          2% calc(var(--tw) * 0.25 + var(--th))
        );
        background: linear-gradient(
          rgba(255, 255, 255, 0.12),
          rgba(0, 0, 0, 0.2)
        );
      }
      .tile {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        padding: 0;
        cursor: pointer;
        clip-path: polygon(50% 2%, 98% 50%, 50% 98%, 2% 50%);
        background:
          linear-gradient(
            150deg,
            rgba(255, 220, 160, 0.28),
            rgba(0, 0, 0, 0.18) 75%
          ),
          repeating-linear-gradient(0deg, #94602f 0 5px, #744724 5px 7px);
      }
      .tile:hover {
        filter: brightness(1.15);
      }
      .tile.lock {
        background: rgba(255, 255, 255, 0.16);
        cursor: default;
      }
      .tile.lock.buy {
        background: rgba(255, 255, 255, 0.32);
        cursor: pointer;
      }
      .tile.armed,
      .tile.lock.armed {
        background: var(--accent);
      }
      .tile:focus-visible {
        outline: 3px solid #fff;
        background-color: #fff;
      }
      .ov {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .spr {
        position: absolute;
        left: 50%;
        width: calc(var(--tw) * 0.9);
        height: calc(var(--tw) * 0.9);
        margin-left: calc(var(--tw) * -0.45);
        top: calc(var(--tw) * -0.434);
      }
      .spr svg {
        position: relative;
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 2px 1px rgba(30, 15, 0, 0.35));
      }
      .spr::before {
        content: "";
        position: absolute;
        left: 16%;
        right: 16%;
        bottom: 3%;
        height: 13%;
        border-radius: 50%;
        background: rgba(25, 12, 0, 0.32);
        filter: blur(2px);
      }
      .spr.bob {
        animation: bob 1.2s ease-in-out infinite;
        transform-origin: 50% 85%;
      }
      @keyframes bob {
        50% {
          transform: translateY(-4px) scale(1.05);
        }
      }
      .pbar {
        position: absolute;
        left: 28%;
        right: 28%;
        bottom: 20%;
        height: 4px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      .pbar i {
        display: block;
        height: 100%;
        background: #ffe27a;
      }
      .badge {
        position: absolute;
        left: 50%;
        top: calc(var(--tw) * -0.5);
        width: 18px;
        height: 18px;
        margin-left: 6px;
        border-radius: 50%;
        background: var(--coin);
        color: #5a3d00;
        font-weight: 700;
        font-size: 12px;
        line-height: 18px;
        text-align: center;
        border: 2px solid #fff;
      }
      .wd {
        position: absolute;
        left: 50%;
        top: 18%;
        width: calc(var(--tw) * 0.36);
        margin-left: calc(var(--tw) * -0.18);
      }
      .lk {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        color: #2e5d0f;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
        gap: 2px;
      }
      .lk svg {
        width: 12px;
        height: 12px;
      }
      .float {
        position: absolute;
        pointer-events: none;
        font-family: var(--font-display);
        font-size: 20px;
        color: #ffe27a;
        -webkit-text-stroke: 1px #5a3d00;
        animation: up 0.9s ease-out forwards;
        z-index: 4;
      }
      @keyframes up {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(-40px);
        }
      }
      .shade {
        inset: 0;
        background: rgba(30, 20, 70, var(--shade));
        pointer-events: none;
        z-index: 5;
      }
      .hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px max(16px, env(safe-area-inset-right, 0px)) 0
          max(16px, env(safe-area-inset-left, 0px));
      }
      .pill {
        background: var(--hud);
        color: var(--hud-ink);
        border: 2px solid var(--hud-line);
        border-radius: 14px;
      }
      .coins {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px 6px 8px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .coin {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--coin);
        border: 3px solid #8a6200;
        flex: none;
      }
      .who {
        flex: 1;
        min-width: 0;
        padding: 5px 10px 7px;
        text-align: center;
      }
      .who b {
        display: block;
        font-family: var(--font-display);
        font-weight: 400;
        font-size: 16px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .xpb {
        position: relative;
        height: 14px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      .xpb i {
        position: absolute;
        inset: 0 auto 0 0;
        background: linear-gradient(#8fe06a, #4c9a38);
      }
      .xpb span {
        position: relative;
        display: block;
        font-size: 10px;
        font-weight: 700;
        line-height: 14px;
        font-variant-numeric: tabular-nums;
      }
      .lvlb {
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--coin);
        color: #5a3d00;
        border: 3px solid #8a6200;
        font-family: var(--font-display);
        text-align: center;
        line-height: 30px;
        font-size: 18px;
        margin-left: -4px;
      }
      .help {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        font-family: var(--font-display);
        font-size: 20px;
        padding: 0;
      }
      .toast {
        position: absolute;
        z-index: 7;
        top: 74px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        background: var(--hud);
        color: var(--hud-ink);
        border: 2px solid var(--hud-line);
        border-radius: 12px;
        padding: 8px 14px;
        font-weight: 700;
        text-align: center;
        pointer-events: none;
      }
      .toast:empty {
        display: none;
      }
      .tools {
        position: absolute;
        z-index: 6;
        left: 0;
        right: 0;
        bottom: 80px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0
          max(16px, env(safe-area-inset-left, 0px));
      }
      .tb {
        background: var(--hud);
        color: var(--hud-ink);
        border: 2px solid var(--hud-line);
        border-radius: 12px;
        padding: 7px 11px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .tb[aria-pressed="true"] {
        border-color: #ffd54a;
        box-shadow: 0 0 0 2px rgba(255, 213, 74, 0.35);
      }
      .tb .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #fff3d6;
      }
      .tb:focus-visible,
      .mi:focus-visible {
        outline: 3px solid #ffd54a;
        outline-offset: 2px;
      }
      .menu {
        position: absolute;
        z-index: 6;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--hud);
        border-top: 3px solid var(--hud-line);
      }
      .menu-in {
        display: flex;
        overflow-x: auto;
        gap: 2px;
        scrollbar-width: none;
        padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px
          max(16px, env(safe-area-inset-left, 0px));
      }
      .menu-in::-webkit-scrollbar {
        display: none;
      }
      .menu-in::before,
      .menu-in::after {
        content: "";
        margin: auto;
      }
      .mi {
